[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-claim-verifier"
version = "0.1.0"
description = "Hybrid retrieval and evidence-based verification for climate claims"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
climate-claim-verifier = "climate_verification.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["climate_verification", "climate_verification.*"]
